<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poster Design | Hannah Do</title>
  <link rel="stylesheet" href="poster.css" />
</head>

<body>
  <nav class="nav">
    <a href="index.html">home</a>
    <a href="about.html">about</a>
    <a href="index.html#projects">projects</a>
    <a href="contact.html">contact</a>
  </nav>

  <section class="poster-page">
    <div class="grid-bg grid-left"></div>
    <div class="grid-bg grid-right"></div>

    <div class="poster-header">
      <h1>Poster <span>Design</span></h1>
      <div class="checker"></div>
    </div>

    <div class="poster-layout">
      <div class="poster-card square">
        <img src="Poster/typo.png" alt="Typography poster">
      </div>

      <div class="poster-card tall">
        <img src="Poster/poster 1.png" alt="Sushi poster">
      </div>

      <div class="poster-card tall">
        <img src="Poster/poster 2.png" alt="Tangled poster">
      </div>

      <div class="poster-card square">
        <img src="Poster/poster 3.png" alt="Croissant poster">
      </div>

      <div class="poster-card tall">
        <img src="Poster/4.png" alt="Croissant promotional poster">
      </div>

      <div class="poster-card tall">
        <img src="Poster/5.png" alt="Croissant poster design">
      </div>

      <div class="poster-card square">
        <img src="Poster/6.png" alt="Croissant social poster">
      </div>

      <div class="poster-card tall">
        <img src="Poster/7.png" alt="Croissant spring poster">
      </div>
    </div>

    <div class="poster-description">
      <p>
        This page showcases a collection of personal and experimental poster designs.
        Each piece explores a different visual direction, from bold typography and
        food advertising to cultural graphics and cinematic poster layouts.
      </p>

      <p class="credit">©2026</p>
    </div>
    <a href="index.html" class="button">Back to Projects</a>
  </section>
</body>
</html>
